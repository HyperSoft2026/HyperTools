name: Build HyperTools Android Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-release-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application (dist)
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      # Decode Release Keystore securely from GitHub Secrets
      - name: Setup Release Keystore
        if: "${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}"
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          echo "Release keystore prepared successfully."

      # Build Signed Release APK
      - name: Build Release APK with Gradle
        env:
          KEYSTORE_FILE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && 'release.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          if [ -z "$KEYSTORE_FILE" ]; then
            echo "::error::Missing RELEASE_KEYSTORE_BASE64 secret! Please add the release signing secrets in GitHub Settings -> Secrets and variables -> Actions."
            echo "Building unsigned Release APK for inspection..."
            ./gradlew assembleRelease --stacktrace
          else
            echo "Building Signed Production Release APK (v1.0.1)..."
            ./gradlew assembleRelease --stacktrace
          fi

      # Upload Release APK Artifact
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperTools-v1.0.1-Release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
