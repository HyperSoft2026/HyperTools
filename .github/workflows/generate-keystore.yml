name: Generate HyperTools Release Keystore

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key Alias name'
        required: true
        default: 'hypertools'
      password:
        description: 'Keystore and Key Password (at least 6 characters)'
        required: true
        type: string

jobs:
  create-keystore:
    name: Generate Production Keystore
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate RSA 2048-bit Release Keystore
        run: |
          mkdir -p keystore_output
          keytool -genkeypair \
            -v \
            -keystore keystore_output/hypertools-release.jks \
            -alias "${{ inputs.alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=HyperTools, OU=HyperSoft Mobile, O=HyperSoft, C=US" \
            -storepass "${{ inputs.password }}" \
            -keypass "${{ inputs.password }}"

      - name: Encode Keystore to Base64 (Without logging content)
        run: |
          base64 -w 0 keystore_output/hypertools-release.jks > keystore_output/release_keystore_base64.txt
          echo "Keystore base64 generated securely into release_keystore_base64.txt"

      - name: Print Public Certificate Fingerprints (For APKPure verification)
        run: |
          echo "=== Certificate Public Fingerprints ==="
          keytool -list -v \
            -keystore keystore_output/hypertools-release.jks \
            -alias "${{ inputs.alias }}" \
            -storepass "${{ inputs.password }}" | grep -E "SHA1:|SHA256:|Owner:"

      - name: Create Instructions File
        run: |
          cat << 'EOF' > keystore_output/INSTRUCTIONS.txt
          =======================================================
          HyperTools Production Release Keystore Setup
          =======================================================

          Follow these steps in your GitHub repository:
          1. Go to: Settings -> Secrets and variables -> Actions
          2. Click: New repository secret

          Add the following 4 secrets:
          - Name: RELEASE_KEYSTORE_BASE64
            Value: (Paste the entire single line from release_keystore_base64.txt)

          - Name: KEYSTORE_PASSWORD
            Value: (The password you chose when running this workflow)

          - Name: KEY_ALIAS
            Value: (The alias you chose, e.g. hypertools)

          - Name: KEY_PASSWORD
            Value: (The password you chose when running this workflow)

          CRITICAL:
          - Save hypertools-release.jks securely in a safe place.
          - Never commit hypertools-release.jks or the password into Git.
          =======================================================
          EOF

      - name: Upload Keystore Artifact Securely
        uses: actions/upload-artifact@v4
        with:
          name: HyperTools-Release-Keystore-Backup
          path: keystore_output/
          retention-days: 5
